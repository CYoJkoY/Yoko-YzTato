name: Build Mod Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '3.7-dev1'

jobs:
  release:
    name: Build ${{ github.ref_name }}
    runs-on: windows-2022

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid tag '$tag'. Expected vX.Y.Z, for example v1.2.3."
          }

          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Read manifest metadata
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath 'manifest.json')) {
            Write-Error 'manifest.json was not found at repository root.'
          }

          $manifest = Get-Content -LiteralPath 'manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($key in @('name', 'namespace')) {
            if (-not $manifest.PSObject.Properties.Name.Contains($key)) {
              Write-Error "manifest.json is missing '$key'."
            }

            if ([string]::IsNullOrWhiteSpace([string]$manifest.$key)) {
              Write-Error "manifest.json '$key' must not be empty."
            }
          }

          $name = [string]$manifest.name
          $namespace = [string]$manifest.namespace

          foreach ($pair in @(
            @{ Key = 'name'; Value = $name },
            @{ Key = 'namespace'; Value = $namespace }
          )) {
            if ($pair.Value -in @('.', '..') -or $pair.Value.Contains('/') -or $pair.Value.Contains('\')) {
              Write-Error "manifest.$($pair.Key) contains an invalid path component: '$($pair.Value)'."
            }
          }

          # Git tag is the single source of truth for release version.
          $version = '${{ steps.version.outputs.version }}'
          $modDirectory = "$namespace-$name"
          $zipName = "$name-$version.zip"

          "name=$name" >> $env:GITHUB_OUTPUT
          "namespace=$namespace" >> $env:GITHUB_OUTPUT
          "mod_directory=$modDirectory" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

          Write-Host "Mod directory: $modDirectory"
          Write-Host "Release ZIP  : $zipName"

      - name: Install Godot 3.7-dev1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $godotDir = Join-Path $env:RUNNER_TEMP 'godot'
          New-Item -ItemType Directory -Force -Path $godotDir | Out-Null

          $downloadUrl = 'https://downloads.godotengine.org/?version=3.7&flavor=dev1&platform=windows.64&slug=win64.exe.zip'
          $archive = Join-Path $godotDir 'godot.zip'

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $godotDir -Force

          $godot = Get-ChildItem -LiteralPath $godotDir -Filter 'Godot_v3.7-dev1_win64.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $godot) {
            Write-Error 'Godot_v3.7-dev1_win64.exe was not found after extraction.'
          }

          "GODOT_BIN=$($godot.FullName)" >> $env:GITHUB_ENV
          & $godot.FullName --version

      - name: Prepare isolated Godot project
        id: prepare
        shell: pwsh
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $env:RUNNER_TEMP 'mod-project'
          $modRoot = Join-Path $project "mods-unpacked\$env:MOD_DIRECTORY"

          if (Test-Path $project) {
            Remove-Item -LiteralPath $project -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $modRoot | Out-Null

          # Copy the repository without Git/editor metadata.
          robocopy $env:GITHUB_WORKSPACE $modRoot /E `
            /XD '.git' '.github' '.godot' 'ci' 'dist' `
            /XF '.editorconfig' '.gitattributes' '.gitignore' `
                'project.godot' 'project.godot.*' 'export_presets.cfg' `
                '.gdignore' '*.csv.import' '*.md5'

          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            Write-Error "robocopy failed with exit code $robocopyExitCode"
          }

          # Robocopy uses exit codes 0-7 for successful/non-fatal outcomes.
          # Explicitly reset the PowerShell step to success before continuing.
          $global:LASTEXITCODE = 0

          # This is only the host project used to run Godot's importer.
          # It is never copied into the Mod ZIP.
          @'
          ; Temporary CI host project.
          config_version=4

          [application]
          config/name="Mod Build CI"
          '@ | Set-Content -LiteralPath (Join-Path $project 'project.godot') -Encoding UTF8

          "project=$project" >> $env:GITHUB_OUTPUT
          "mod_root=$modRoot" >> $env:GITHUB_OUTPUT

      - name: Sync manifest version in temporary copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_ROOT: ${{ steps.prepare.outputs.mod_root }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = Join-Path $env:MOD_ROOT 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.version_number = $env:VERSION

          $json = $manifest | ConvertTo-Json -Depth 100
          $json | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $check = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$check.version_number -ne $env:VERSION) {
            Write-Error "Failed to synchronize manifest version."
          }

      - name: Import resources with Godot 3.7-dev1
        env:
          PROJECT: ${{ steps.prepare.outputs.project }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = $env:PROJECT
          $importDir = Join-Path $project '.import'
          $logFile = Join-Path $env:RUNNER_TEMP 'godot-import.log'

          if (Test-Path $importDir) {
            Remove-Item -LiteralPath $importDir -Recurse -Force
          }

          # Run the actual Godot 3.7-dev1 editor on Windows. Do not rely on
          # --quit immediately: the FileSystem scan/import work is asynchronous.
          $process = Start-Process -FilePath $env:GODOT_BIN `
            -ArgumentList @('--path', $project, '--editor', '--headless', '--audio-driver', 'Dummy') `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $logFile `
            -PassThru

          try {
            $deadline = (Get-Date).AddMinutes(10)
            $lastCount = -1
            $stableChecks = 0
            $importDone = $false

            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                Write-Host (Get-Content -LiteralPath $logFile -Raw -ErrorAction SilentlyContinue)
                Write-Error "Godot exited before resource import completed. Exit code: $($process.ExitCode)"
              }

              if (Test-Path $importDir) {
                $files = Get-ChildItem -LiteralPath $importDir -File -Recurse |
                  Where-Object { $_.Name -ne '.gdignore' -and $_.Name -notlike '*.md5' }
                $count = @($files).Count

                if ($count -gt 0) {
                  if ($count -eq $lastCount) {
                    $stableChecks++
                  } else {
                    $lastCount = $count
                    $stableChecks = 0
                  }

                  Write-Host "Imported resource files: $count (stable checks: $stableChecks/8)"

                  if ($stableChecks -ge 8) {
                    $importDone = $true
                    break
                  }
                }
              }

              Start-Sleep -Seconds 1
            }

            if (-not $importDone) {
              Write-Host 'Godot import log:'
              Get-Content -LiteralPath $logFile -Raw -ErrorAction SilentlyContinue
              Write-Error 'Timed out waiting for Godot resource import to complete.'
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

          $realImports = Get-ChildItem -LiteralPath $importDir -File -Recurse |
            Where-Object { $_.Name -ne '.gdignore' -and $_.Name -notlike '*.md5' }

          if (@($realImports).Count -eq 0) {
            Write-Error 'No imported resources were generated.'
          }

          Write-Host "Godot generated $(@($realImports).Count) imported resource files."

      - name: Build ModLoader ZIP with 7-Zip
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          PROJECT: ${{ steps.prepare.outputs.project }}
          MOD_ROOT: ${{ steps.prepare.outputs.mod_root }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stage = Join-Path $env:RUNNER_TEMP 'export-stage'
          $release = Join-Path $env:RUNNER_TEMP 'release'
          $zip = Join-Path $release $env:ZIP_NAME

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          if (Test-Path $release) { Remove-Item $release -Recurse -Force }

          New-Item -ItemType Directory -Force -Path (Join-Path $stage "mods-unpacked\$env:MOD_DIRECTORY") | Out-Null
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # Keep only real Mod files. The repository's dotfiles and editor
          # metadata never enter the release package.
          robocopy $env:MOD_ROOT (Join-Path $stage "mods-unpacked\$env:MOD_DIRECTORY") /E `
            /XD '.git' '.github' '.godot' `
            /XF '.editorconfig' '.gitattributes' '.gitignore' `
                '.gdignore' '*.csv.import' '*.md5' `
                'project.godot' 'project.godot.*' 'export_presets.cfg'

          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            Write-Error "robocopy failed while copying the Mod (exit code $robocopyExitCode)"
          }
          $global:LASTEXITCODE = 0

          # The generated project-level .import tree is required by ModLoader.
          $projectImport = Join-Path $env:PROJECT '.import'
          if (-not (Test-Path $projectImport)) {
            Write-Error 'The generated project .import directory is missing.'
          }

          $stageImport = Join-Path $stage '.import'
          New-Item -ItemType Directory -Force -Path $stageImport | Out-Null

          robocopy $projectImport $stageImport /E `
            /XF '.gdignore' '*.csv.import' '*.md5'

          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            Write-Error "robocopy failed while copying .import (exit code $robocopyExitCode)"
          }
          $global:LASTEXITCODE = 0

          # Defensive cleanup of files that must never ship.
          Get-ChildItem -LiteralPath $stage -File -Recurse -Force |
            Where-Object {
              $_.Name -eq '.gdignore' -or
              $_.Name -eq '.editorconfig' -or
              $_.Name -eq '.gitattributes' -or
              $_.Name -eq '.gitignore' -or
              $_.Name -like '*.csv.import' -or
              $_.Name -like '*.md5'
            } |
            Remove-Item -Force

          # Remove empty directories created solely by ignored files.
          Get-ChildItem -LiteralPath $stage -Directory -Recurse -Force |
            Sort-Object FullName -Descending |
            Where-Object { @(Get-ChildItem -LiteralPath $_.FullName -Force).Count -eq 0 } |
            Remove-Item -Force

          # Use 7-Zip, matching the tool used by Godot Mod Tool on Windows.
          # Deflate level 9 is used for normal source/config/resource files.
          # .stex is intentionally NOT in a Store list: these files must be
          # compressed normally as requested.
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $candidates = @(
              "$env:ProgramFiles\7-Zip\7z.exe",
              "$env:ChocolateyInstall\bin\7z.exe"
            )
            $sevenZip = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }

          if (-not $sevenZip) {
            Write-Error '7z.exe was not found on the Windows runner.'
          }

          & $sevenZip a -tzip -mx=9 -mm=Deflate -mfb=258 -mpass=15 $zip (Join-Path $stage '*')
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path $zip)) {
            Write-Error "Release ZIP was not created: $zip"
          }

          Write-Host "Created release archive: $zip"

      - name: Verify ZIP
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $env:RUNNER_TEMP "release\$env:ZIP_NAME"
          if (-not (Test-Path $zip)) {
            Write-Error "Missing ZIP: $zip"
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }

          & $sevenZip t $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $listing = & $sevenZip l -slt $zip | Out-String

          $requiredManifest = "mods-unpacked\$env:MOD_DIRECTORY\manifest.json"
          if ($listing -notmatch [regex]::Escape($requiredManifest)) {
            Write-Error "Required manifest missing from ZIP: $requiredManifest"
          }

          if ($listing -match '(?im)^Path = \.import\\') {
            Write-Host 'Top-level .import directory detected.'
          } else {
            Write-Error 'Top-level .import directory is missing from ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.gdignore$') {
            Write-Error '.gdignore must not be included in the release ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.csv\.import$') {
            Write-Error '*.csv.import must not be included in the release ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.md5$') {
            Write-Error '*.md5 files must not be included in the release ZIP.'
          }

          foreach ($dotfile in @('.editorconfig', '.gitattributes', '.gitignore')) {
            if ($listing -match ('(?im)^Path = .*' + [regex]::Escape($dotfile) + '$')) {
              Write-Error "$dotfile must not be included in the release ZIP."
            }
          }

          $tempManifest = Join-Path $env:RUNNER_TEMP 'release-manifest.json'
          & $sevenZip e $zip $requiredManifest -so | Set-Content -LiteralPath $tempManifest -Encoding UTF8

          $releaseManifest = Get-Content -LiteralPath $tempManifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$releaseManifest.version_number -ne $env:VERSION) {
            Write-Error "Release manifest version mismatch: expected $env:VERSION, got $($releaseManifest.version_number)."
          }

          Write-Host "Verified release version: $($releaseManifest.version_number)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.manifest.outputs.name }}-${{ steps.version.outputs.version }}
          path: ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.manifest.outputs.name }} ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
