name: Build Mod Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '3.7-dev1'

jobs:
  release:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot headless binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/godot
          key: godot-headless-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Validate tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Expected vX.Y.Z, for example v1.2.3."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read manifest metadata
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f manifest.json || {
            echo "::error::manifest.json was not found at repository root."
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("manifest.json").read_text(encoding="utf-8-sig"))
          for key in ("name", "namespace"):
              value = data.get(key)
              if not isinstance(value, str) or not value.strip():
                  raise SystemExit(f"manifest.json field '{key}' must be a non-empty string")
              value = value.strip()
              if value in {".", ".."} or "/" in value or "\\" in value:
                  raise SystemExit(f"Invalid manifest.{key}: {value!r}")
          PY

          NAME="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8-sig"))["name"].strip())')"
          NAMESPACE="$(python3 -c 'import json; print(json.load(open("manifest.json", encoding="utf-8-sig"))["namespace"].strip())')"
          VERSION="${{ steps.version.outputs.version }}"
          MOD_DIRECTORY="${NAMESPACE}-${NAME}"
          ZIP_NAME="${NAME}-${VERSION}.zip"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE" >> "$GITHUB_OUTPUT"
          echo "mod_directory=$MOD_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          echo "Mod directory: $MOD_DIRECTORY"
          echo "ZIP name: $ZIP_NAME"

      - name: Install Godot 3.7-dev1 headless
        shell: bash
        run: |
          set -euo pipefail

          GODOT_DIR="$RUNNER_TEMP/godot"
          GODOT_BIN="$GODOT_DIR/Godot_v3.7-dev1_linux_headless.64"
          DOWNLOAD_URL='https://downloads.godotengine.org/?version=3.7&flavor=dev1&platform=linux_headless.64&slug=linux_headless.64.zip'

          if [[ ! -x "$GODOT_BIN" ]]; then
            rm -rf "$GODOT_DIR"
            mkdir -p "$GODOT_DIR"

            echo "Godot cache miss; downloading Godot 3.7-dev1 headless."
            curl -L --fail --retry 5 --retry-delay 2 --retry-all-errors \
              "$DOWNLOAD_URL" \
              -o "$GODOT_DIR/godot.zip"

            unzip -q "$GODOT_DIR/godot.zip" -d "$GODOT_DIR"
            FOUND="$(find "$GODOT_DIR" -type f -name 'Godot_v3.7-dev1_linux_headless.64' -print -quit)"
            if [[ -z "$FOUND" ]]; then
              echo "::error::Godot_v3.7-dev1_linux_headless.64 was not found after extraction."
              find "$GODOT_DIR" -maxdepth 3 -type f -print
              exit 1
            fi

            if [[ "$FOUND" != "$GODOT_BIN" ]]; then
              mv "$FOUND" "$GODOT_BIN"
            fi
            chmod +x "$GODOT_BIN"
            rm -f "$GODOT_DIR/godot.zip"
          else
            echo 'Godot cache hit; skipping download.'
          fi

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Prepare temporary Godot project
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$RUNNER_TEMP/mod-project"
          MOD_ROOT="$PROJECT/mods-unpacked/$MOD_DIRECTORY"
          rm -rf "$PROJECT"
          mkdir -p "$MOD_ROOT"

          # Build the exact ModLoader development layout while keeping the
          # repository free of generated .import files.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.godot/' \
            --exclude='.ci/' \
            --exclude='ci/' \
            --exclude='dist/' \
            --exclude='.*' \
            --exclude='project.godot' \
            --exclude='project.godot.*' \
            --exclude='export_presets.cfg' \
            --exclude='*.csv.import' \
            --exclude='*.md5' \
            --exclude='.gdignore' \
            ./ "$MOD_ROOT/"

          cat > "$PROJECT/project.godot" <<'GODOT'
          ; Temporary CI project. Never included in the release ZIP.
          config_version=4

          [application]
          config/name="Mod Build CI"
          GODOT

      - name: Sync manifest version in temporary copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$RUNNER_TEMP/mod-project/mods-unpacked/$MOD_DIRECTORY/manifest.json"
          VERSION="$VERSION" MANIFEST="$MANIFEST" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["MANIFEST"])
          version = os.environ["VERSION"]
          data = json.loads(path.read_text(encoding="utf-8-sig"))
          data["version_number"] = version
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          check = json.loads(path.read_text(encoding="utf-8"))
          if check.get("version_number") != version:
              raise SystemExit("manifest version update failed")
          PY

      - name: Import resources with Godot 3.7-dev1
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$RUNNER_TEMP/mod-project"
          IMPORT_DIR="$PROJECT/.import"
          LOG_FILE="$RUNNER_TEMP/godot-import.log"

          rm -rf "$IMPORT_DIR"

          echo "Starting Godot resource import..."
          set +e
          "$GODOT_BIN" \
            --path "$PROJECT" \
            --import \
            >"$LOG_FILE" 2>&1
          GODOT_EXIT=$?
          set -e

          cat "$LOG_FILE"

          if (( GODOT_EXIT != 0 )); then
            echo "::error::Godot resource import failed with exit code $GODOT_EXIT."
            exit "$GODOT_EXIT"
          fi

          if [[ ! -d "$IMPORT_DIR" ]]; then
            echo "::error::Godot did not create project-level .import directory."
            exit 1
          fi

          IMPORT_COUNT="$(find "$IMPORT_DIR" -type f ! -name '.gdignore' ! -name '*.md5' | wc -l)"
          if (( IMPORT_COUNT == 0 )); then
            echo "::error::Godot created an empty .import directory."
            exit 1
          fi

          echo "Godot generated $IMPORT_COUNT imported resource files."

      - name: Build ModLoader ZIP
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$RUNNER_TEMP/mod-project"
          MOD_ROOT="$PROJECT/mods-unpacked/$MOD_DIRECTORY"
          STAGE="$RUNNER_TEMP/export-stage"
          RELEASE="$RUNNER_TEMP/release"
          ZIP="$RELEASE/$ZIP_NAME"

          rm -rf "$STAGE" "$RELEASE"
          mkdir -p "$STAGE/mods-unpacked/$MOD_DIRECTORY" "$STAGE/.import" "$RELEASE"

          # Copy only the Mod source tree. Hidden files and editor metadata are
          # intentionally excluded from the release package.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.godot/' \
            --exclude='.ci/' \
            --exclude='ci/' \
            --exclude='dist/' \
            --exclude='.*' \
            --exclude='project.godot' \
            --exclude='project.godot.*' \
            --exclude='export_presets.cfg' \
            --exclude='*.csv.import' \
            --exclude='*.md5' \
            --exclude='.gdignore' \
            "$MOD_ROOT/" \
            "$STAGE/mods-unpacked/$MOD_DIRECTORY/"

          test -d "$PROJECT/.import" || {
            echo "::error::Generated project .import directory is missing."
            exit 1
          }

          # IMPORTANT:
          # Do not blindly copy the entire project-level .import directory.
          # Godot Mod Loader documentation requires the ZIP to contain only
          # the Mod's custom imported assets, not unrelated/vanilla imports.
          #
          # Godot 3.x writes the generated destination paths into each source
          # asset's .import descriptor. Read those dest_files entries and copy
          # only the generated files referenced by this Mod.
          python3 - "$MOD_ROOT" "$PROJECT/.import" "$STAGE/.import" <<'PY'
          import re
          import shutil
          import sys
          from pathlib import Path

          mod_root = Path(sys.argv[1])
          import_root = Path(sys.argv[2])
          stage_import = Path(sys.argv[3])

          project_prefix = f"res://mods-unpacked/{mod_root.name}/"
          dest_re = re.compile(r'"(res://\.import/[^"]+)"')

          descriptors = []
          wanted = set()

          for descriptor in mod_root.rglob("*.import"):
              if descriptor.name.endswith(".csv.import"):
                  continue

              descriptors.append(descriptor)

              text = descriptor.read_text(encoding="utf-8-sig", errors="replace")

              # Only copy destinations belonging to the project-level .import
              # directory. This handles importers producing multiple outputs.
              for match in dest_re.finditer(text):
                  rel = match.group(1)[len("res://.import/"):]
                  rel_path = Path(rel)

                  # Prevent traversal out of .import.
                  if any(part == ".." for part in rel_path.parts):
                      raise SystemExit(
                          f"Invalid imported destination in {descriptor}: {rel!r}"
                      )

                  wanted.add(rel)

          if not descriptors:
              raise SystemExit(
                  "No .import descriptors were found in the Mod source tree."
              )

          if not wanted:
              raise SystemExit(
                  "Mod .import descriptors did not reference any generated "
                  "res://.import/* destinations."
              )

          copied = 0
          missing = []

          for rel in sorted(wanted):
              source = import_root / rel
              if not source.is_file():
                  missing.append(rel)
                  continue

              target = stage_import / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              copied += 1

          if missing:
              print("Missing generated import files:", file=sys.stderr)
              for rel in missing:
                  print(f"  {rel}", file=sys.stderr)
              raise SystemExit(
                  f"{len(missing)} generated import file(s) referenced by the "
                  "Mod were not found."
              )

          print(f"Mod import descriptors: {len(descriptors)}")
          print(f"Staged custom imported resources: {copied}")
          for rel in sorted(wanted):
              print(f"  .import/{rel}")
          PY

          IMPORT_COUNT="$(find "$STAGE/.import" -type f ! -name '.gdignore' ! -name '*.csv.import' ! -name '*.md5' | wc -l)"
          if (( IMPORT_COUNT == 0 )); then
            echo "::error::No Mod-specific imported resources were staged."
            exit 1
          fi

          # Remove forbidden/internal files defensively.
          find "$STAGE" -type f \
            \( -name '.gdignore' -o -name '*.csv.import' -o -name '*.md5' \) \
            -delete

          find "$STAGE/mods-unpacked/$MOD_DIRECTORY" -type d -name '.*' -prune -exec rm -rf {} +
          find "$STAGE/mods-unpacked/$MOD_DIRECTORY" -type f -name '.*' -delete

          # Make sure the staged .import contains only files we intentionally
          # selected and that every staged resource really exists.
          if find "$STAGE" -type f \
            \( -name '.gdignore' -o -name '*.csv.import' -o -name '*.md5' \) \
            -print -quit | grep -q .; then
            echo "::error::Forbidden internal file found in export stage."
            exit 1
          fi

          STAGED_IMPORT_COUNT="$(find "$STAGE/.import" -type f ! -name '.gdignore' ! -name '*.csv.import' ! -name '*.md5' | wc -l)"
          if (( STAGED_IMPORT_COUNT != IMPORT_COUNT )); then
            echo "::error::Unexpected change in staged import count: before=$IMPORT_COUNT after=$STAGED_IMPORT_COUNT"
            exit 1
          fi

          echo "Staged custom imported resources: $STAGED_IMPORT_COUNT"

          # Keep the proven Linux release path and normal ZIP compression.
          # .stex/.ctex are intentionally compressed rather than stored.
          # Common already-compressed formats remain stored.
          (
            cd "$STAGE"
            zip -r -q -6 \
              -n '.png:.webp:.jpg:.jpeg:.gif:.bmp:.ico:.dds:.ogg:.oggstr:.mp3:.aac:.m4a:.mp4:.webm:.zip:.7z:.rar:.gz:.bz2:.xz:.zst' \
              "$ZIP" .
          )

          test -f "$ZIP"
          echo "Created release archive: $ZIP"
      - name: Verify ZIP structure
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$RUNNER_TEMP/release/$ZIP_NAME"
          MANIFEST_PATH="mods-unpacked/$MOD_DIRECTORY/manifest.json"
          test -f "$ZIP" || {
            echo "::error::Missing ZIP: $ZIP"
            exit 1
          }

          LISTING="$(unzip -l "$ZIP")"

          grep -Eq '(^|[[:space:]])\.import/' <<< "$LISTING" || {
            echo "::error::Top-level .import directory is missing from the ZIP."
            exit 1
          }

          grep -Eq '(^|[[:space:]])\.import/[^[:space:]]+$' <<< "$LISTING" || {
            echo "::error::No imported resource files were found under .import/."
            exit 1
          }

          ! grep -Eq '(^|[[:space:]])\.gdignore($|[[:space:]])' <<< "$LISTING" || {
            echo "::error::.gdignore must not be included in the release ZIP."
            exit 1
          }

          ! grep -Eq '\.csv\.import($|[[:space:]])' <<< "$LISTING" || {
            echo "::error::CSV .import descriptors must not be included in the release ZIP."
            exit 1
          }

          ! grep -Eq '(^|[[:space:]])[^[:space:]]*\.md5($|[[:space:]])' <<< "$LISTING" || {
            echo "::error::.md5 checksum files must not be included in the release ZIP."
            exit 1
          }

          ! grep -Eq 'mods-unpacked/[^ ]*/\.[^./][^[:space:]]*' <<< "$LISTING" || {
            echo "::error::Repository/editor dotfiles must not be included in the release ZIP."
            exit 1
          }

          grep -Fq "$MANIFEST_PATH" <<< "$LISTING" || {
            echo "::error::Missing $MANIFEST_PATH"
            exit 1
          }

          unzip -p "$ZIP" "$MANIFEST_PATH" > "$RUNNER_TEMP/release-manifest.json"
          VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["VERSION"]
          path = Path(os.environ["RUNNER_TEMP"]) / "release-manifest.json"
          actual = json.loads(path.read_text(encoding="utf-8"))["version_number"]
          if actual != expected:
              raise SystemExit(f"Manifest version mismatch: expected {expected!r}, got {actual!r}")
          print(f"Verified manifest version: {actual}")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.manifest.outputs.name }} ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
