name: Build Mod Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GODOT_VERSION: '3.7-dev1'

jobs:
  release:
    name: Build ${{ github.ref_name }}
    runs-on: windows-2022

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ci/import-cache
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ github.sha }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Validate tag
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid tag '$tag'. Expected vX.Y.Z, for example v1.2.3."
          }

          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Read manifest metadata
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path -LiteralPath 'manifest.json')) {
            Write-Error 'manifest.json was not found at repository root.'
          }

          $manifest = Get-Content -LiteralPath 'manifest.json' -Raw -Encoding UTF8 | ConvertFrom-Json

          foreach ($key in @('name', 'namespace')) {
            if (-not $manifest.PSObject.Properties.Name.Contains($key)) {
              Write-Error "manifest.json is missing '$key'."
            }

            if ([string]::IsNullOrWhiteSpace([string]$manifest.$key)) {
              Write-Error "manifest.json '$key' must not be empty."
            }
          }

          $name = [string]$manifest.name
          $namespace = [string]$manifest.namespace

          foreach ($pair in @(
            @{ Key = 'name'; Value = $name },
            @{ Key = 'namespace'; Value = $namespace }
          )) {
            if ($pair.Value -in @('.', '..') -or $pair.Value.Contains('/') -or $pair.Value.Contains('\')) {
              Write-Error "manifest.$($pair.Key) contains an invalid path component: '$($pair.Value)'."
            }
          }

          # Git tag is the single source of truth for release version.
          $version = '${{ steps.version.outputs.version }}'
          $modDirectory = "$namespace-$name"
          $zipName = "$name-$version.zip"

          "name=$name" >> $env:GITHUB_OUTPUT
          "namespace=$namespace" >> $env:GITHUB_OUTPUT
          "mod_directory=$modDirectory" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT

          Write-Host "Mod directory: $modDirectory"
          Write-Host "Release ZIP  : $zipName"

      - name: Install Godot 3.7-dev1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $godotDir = Join-Path $env:GITHUB_WORKSPACE '.ci\godot'
          $godotExe = Join-Path $godotDir 'Godot_v3.7-dev1_win64.exe'

          if (-not (Test-Path -LiteralPath $godotExe)) {
            $archive = Join-Path $env:RUNNER_TEMP 'Godot_v3.7-dev1_win64.exe.zip'
            $downloadUrl = 'https://github.com/godotengine/godot-builds/releases/download/3.7-dev1/Godot_v3.7-dev1_win64.exe.zip'

            New-Item -ItemType Directory -Force -Path $godotDir | Out-Null

            Write-Host 'Godot cache miss; downloading Godot 3.7-dev1.'
            & curl.exe `
              --fail --location `
              --retry 5 --retry-delay 3 --retry-all-errors `
              --connect-timeout 20 --max-time 600 `
              --output $archive `
              $downloadUrl

            if ($LASTEXITCODE -ne 0) {
              Write-Error "Godot download failed. curl exit code: $LASTEXITCODE"
            }

            Expand-Archive -LiteralPath $archive -DestinationPath $godotDir -Force

            $found = Get-ChildItem -LiteralPath $godotDir -Filter 'Godot_v3.7-dev1_win64.exe' -File -Recurse | Select-Object -First 1
            if ($null -eq $found) {
              Write-Error 'Godot_v3.7-dev1_win64.exe was not found after extraction.'
            }

            if ($found.FullName -ne $godotExe) {
              Copy-Item -LiteralPath $found.FullName -Destination $godotExe -Force
            }
          } else {
            Write-Host 'Godot cache hit; skipping download.'
          }

          "GODOT_BIN=$godotExe" >> $env:GITHUB_ENV
          & $godotExe --version
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Godot --version failed with exit code $LASTEXITCODE"
          }

      - name: Prepare isolated Godot project
        id: prepare
        shell: pwsh
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
        run: |
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $env:RUNNER_TEMP 'mod-project'
          $modRoot = Join-Path $project "mods-unpacked\$env:MOD_DIRECTORY"

          if (Test-Path $project) {
            Remove-Item -LiteralPath $project -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $modRoot | Out-Null

          # Copy the repository without Git/editor metadata.
          robocopy $env:GITHUB_WORKSPACE $modRoot /E `
            /XD '.git' '.github' '.godot' '.ci' 'ci' 'dist' `
            /XF '.editorconfig' '.gitattributes' '.gitignore' `
                'project.godot' 'project.godot.*' 'export_presets.cfg' `
                '.gdignore' '*.csv.import' '*.md5'

          $robocopyExitCode = $LASTEXITCODE
          if ($robocopyExitCode -gt 7) {
            Write-Error "robocopy failed with exit code $robocopyExitCode"
          }

          # Robocopy uses exit codes 0-7 for successful/non-fatal outcomes.
          # Explicitly reset the PowerShell step to success before continuing.
          $global:LASTEXITCODE = 0

          # This is only the host project used to run Godot's importer.
          # It is never copied into the Mod ZIP.
          @'
          ; Temporary CI host project.
          config_version=4

          [application]
          config/name="Mod Build CI"
          '@ | Set-Content -LiteralPath (Join-Path $project 'project.godot') -Encoding UTF8

          "project=$project" >> $env:GITHUB_OUTPUT
          "mod_root=$modRoot" >> $env:GITHUB_OUTPUT

      - name: Sync manifest version in temporary copy
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MOD_ROOT: ${{ steps.prepare.outputs.mod_root }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $manifestPath = Join-Path $env:MOD_ROOT 'manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.version_number = $env:VERSION

          $json = $manifest | ConvertTo-Json -Depth 100
          $json | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $check = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$check.version_number -ne $env:VERSION) {
            Write-Error "Failed to synchronize manifest version."
          }

      - name: Import resources with Godot 3.7-dev1
        env:
          PROJECT: ${{ steps.prepare.outputs.project }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = $env:PROJECT
          $importDir = Join-Path $project '.import'
          $cacheDir = Join-Path $env:GITHUB_WORKSPACE '.ci\import-cache'

          if (Test-Path $importDir) { Remove-Item -LiteralPath $importDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $importDir | Out-Null

          # Reuse previous imports when available. Godot will reimport only
          # resources whose source files have changed.
          if (Test-Path $cacheDir) {
            robocopy $cacheDir $importDir /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -gt 7) {
              Write-Error "Failed to restore cached imports (exit code $LASTEXITCODE)"
            }
            $global:LASTEXITCODE = 0
            Write-Host 'Restored cached .import files.'
          }

          $stdoutLog = Join-Path $env:RUNNER_TEMP 'godot-import.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'godot-import.stderr.log'
          if (Test-Path $stdoutLog) { Remove-Item $stdoutLog -Force }
          if (Test-Path $stderrLog) { Remove-Item $stderrLog -Force }

          $process = Start-Process -FilePath $env:GODOT_BIN `
            -ArgumentList @('--path', $project, '--editor', '--headless', '--audio-driver', 'Dummy') `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog `
            -PassThru

          try {
            $deadline = (Get-Date).AddMinutes(10)
            $lastCount = -1
            $stableChecks = 0
            $importDone = $false
            $observedFiles = $false

            while ((Get-Date) -lt $deadline) {
              if ($process.HasExited) {
                if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw -ErrorAction SilentlyContinue }
                if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw -ErrorAction SilentlyContinue }
                Write-Error "Godot exited before resource import completed. Exit code: $($process.ExitCode)"
              }

              if (Test-Path $importDir) {
                $count = @(Get-ChildItem -LiteralPath $importDir -File -Recurse | Where-Object { $_.Name -ne '.gdignore' -and $_.Name -notlike '*.md5' }).Count

                if ($count -gt 0) {
                  $observedFiles = $true
                  if ($count -eq $lastCount) { $stableChecks++ } else { $lastCount = $count; $stableChecks = 0 }

                  if ($stableChecks -ge 2) {
                    $importDone = $true
                    break
                  }
                }
              }

              Start-Sleep -Milliseconds 500
            }

            if (-not $importDone -or -not $observedFiles) {
              if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw -ErrorAction SilentlyContinue }
              if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw -ErrorAction SilentlyContinue }
              Write-Error 'Timed out waiting for Godot resource import to complete.'
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

          # Refresh the cache for the next release build.
          if (Test-Path $cacheDir) { Remove-Item $cacheDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null
          robocopy $importDir $cacheDir /E /NFL /NDL /NJH /NJS /NP /XF '.gdignore' '*.csv.import' '*.md5' | Out-Null
          if ($LASTEXITCODE -gt 7) {
            Write-Error "Failed to update import cache (exit code $LASTEXITCODE)"
          }
          $global:LASTEXITCODE = 0

          $realImports = Get-ChildItem -LiteralPath $importDir -File -Recurse | Where-Object { $_.Name -ne '.gdignore' -and $_.Name -notlike '*.md5' }
          if (@($realImports).Count -eq 0) { Write-Error 'No imported resources were generated.' }
          Write-Host "Godot generated/retained $(@($realImports).Count) imported resource files."

      - name: Build ModLoader ZIP with 7-Zip
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          PROJECT: ${{ steps.prepare.outputs.project }}
          MOD_ROOT: ${{ steps.prepare.outputs.mod_root }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $release = Join-Path $env:RUNNER_TEMP 'release'
          $zip = Join-Path $release $env:ZIP_NAME
          $packageRoot = Join-Path $env:PROJECT 'mods-unpacked'

          if (Test-Path $release) { Remove-Item $release -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # The Mod was already copied once into mods-unpacked during project
          # preparation. Reuse that tree directly instead of copying it again.
          # The temporary host project.godot is excluded from the archive.
          if (-not (Test-Path (Join-Path $packageRoot $env:MOD_DIRECTORY))) {
            Write-Error 'Prepared mod directory is missing.'
          }
          if (-not (Test-Path (Join-Path $env:PROJECT '.import'))) {
            Write-Error 'Generated project .import directory is missing.'
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not (Test-Path $sevenZip)) { Write-Error '7z.exe was not found on the Windows runner.' }

          & $sevenZip a -tzip -mx=9 -mm=Deflate -mfb=258 -mpass=15 $zip (Join-Path $env:PROJECT '*') `
            -xr!project.godot -xr!project.godot.* -xr!export_presets.cfg `
            -xr!.git -xr!.github -xr!.godot -xr!.ci -xr!ci -xr!dist `
            -xr!.editorconfig -xr!.gitattributes -xr!.gitignore -xr!.gdignore `
            -xr!*.csv.import -xr!*.md5

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $zip)) { Write-Error "Release ZIP was not created: $zip" }
          Write-Host "Created release archive: $zip"

      - name: Verify ZIP
        env:
          MOD_DIRECTORY: ${{ steps.manifest.outputs.mod_directory }}
          ZIP_NAME: ${{ steps.manifest.outputs.zip_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $zip = Join-Path $env:RUNNER_TEMP "release\$env:ZIP_NAME"
          if (-not (Test-Path $zip)) {
            Write-Error "Missing ZIP: $zip"
          }

          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }

          $listing = & $sevenZip l -slt $zip | Out-String

          $requiredManifest = "mods-unpacked\$env:MOD_DIRECTORY\manifest.json"
          if ($listing -notmatch [regex]::Escape($requiredManifest)) {
            Write-Error "Required manifest missing from ZIP: $requiredManifest"
          }

          if ($listing -match '(?im)^Path = \.import\\') {
            Write-Host 'Top-level .import directory detected.'
          } else {
            Write-Error 'Top-level .import directory is missing from ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.gdignore$') {
            Write-Error '.gdignore must not be included in the release ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.csv\.import$') {
            Write-Error '*.csv.import must not be included in the release ZIP.'
          }

          if ($listing -match '(?im)^Path = .*\.md5$') {
            Write-Error '*.md5 files must not be included in the release ZIP.'
          }

          foreach ($dotfile in @('.editorconfig', '.gitattributes', '.gitignore')) {
            if ($listing -match ('(?im)^Path = .*' + [regex]::Escape($dotfile) + '$')) {
              Write-Error "$dotfile must not be included in the release ZIP."
            }
          }

          $tempManifest = Join-Path $env:RUNNER_TEMP 'release-manifest.json'
          & $sevenZip e $zip $requiredManifest -so | Set-Content -LiteralPath $tempManifest -Encoding UTF8

          $releaseManifest = Get-Content -LiteralPath $tempManifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([string]$releaseManifest.version_number -ne $env:VERSION) {
            Write-Error "Release manifest version mismatch: expected $env:VERSION, got $($releaseManifest.version_number)."
          }

          Write-Host "Verified release version: $($releaseManifest.version_number)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.manifest.outputs.name }} ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ runner.temp }}/release/${{ steps.manifest.outputs.zip_name }}
